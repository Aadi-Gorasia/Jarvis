# ───────────── JARVIS configuration ─────────────
# Edit, then run:  ./jarvisctl.sh restart        (problems? run: ./jarvisctl.sh doctor)

assistant:
  name: "Jarvis"
  user_name: ""              # how Jarvis addresses you, e.g. "sir". Blank = no form of address
  home_city: "Pune"          # default city for weather questions
  session_idle_seconds: 600  # forget the current conversation after this much silence

gemini:
  model: "gemini-3.5-flash-lite"       # Jarvis's conversation brain: chosen for speed
  stt_model: "gemini-3.5-flash-lite"   # transcribes your voice
  thinking_level: "minimal"            # minimal | low | medium | high. Less thinking = faster answers
  timeout_seconds: 12                  # give up on a stuck request after this long and fail over

wake:
  model: "hey_jarvis"        # openWakeWord's built-in "Hey Jarvis"
  threshold: 0.5             # raise (0.6-0.8) if it triggers by accident; lower if it misses you

audio:
  device: null               # null = system default mic. Or a device name/index (see: python -m sounddevice)
  min_rms: 120               # speech must be at least this loud (and 3x the room noise, which Jarvis tracks itself)
  noise_multiplier: 3.0
  silence_seconds: 0.8       # a pause this long ends your sentence
  max_seconds: 20            # hard cap on one utterance
  first_utterance_timeout: 10 # seconds to start talking after the wake word
  follow_up_seconds: 6       # stay "awake" this long for follow-up questions
  wake_sound: false          # chime on wake. The screen halo already tells you Jarvis is listening

halo:
  enabled: true              # dark vignette around the screen edges while Jarvis listens, thinks and speaks
  color: [0, 0, 0]           # RGB. Black by default; try [40, 40, 48] for a cooler grey
  intensity: 0.55            # 0-1: how dark it gets at the very edge
  thickness: 0.16            # how far it reaches in, as a fraction of the screen's short side

tts:
  engine: "elevenlabs"       # elevenlabs | say | gemini. Falls back to the Mac voice if ElevenLabs fails or has no key
  elevenlabs_voice_id: "JBFqnCBsd6RMkjVDRZzb"   # "George" (premade). Pick yours at elevenlabs.io/app/voice-library
  elevenlabs_model: "eleven_flash_v2_5"          # lowest latency. eleven_multilingual_v2 sounds richer but is slower
  elevenlabs_max_chars: 500  # a longer sentence uses the free Mac voice, so credits last
  mac_voice: "Daniel"        # the fallback voice. List: say -v '?'
  mac_rate: 185
  gemini_model: "gemini-2.5-flash-preview-tts"
  gemini_voice: "Charon"
  gemini_style: "Say in a calm, dry, British butler tone"

stt:
  provider: "gemini"         # gemini | elevenlabs (Scribe). Each falls back to the other if it fails
  elevenlabs_model: "scribe_v1"

llm:
  # Which language models Jarvis uses, tried in order. A model that fails (quota, outage) is skipped for a while.
  # Providers: gemini | openai (ChatGPT API, needs OPENAI_API_KEY) | ollama (on-device). Ones without a key are skipped.
  jarvis_chain: ["gemini", "openai", "ollama"]
  agents_provider: "ollama"  # first choice for the background agents: ollama | gemini | openai
  gemini_agents: [operator]  # agents that always start on Gemini (they juggle many tools)
  fallback_order: ["gemini", "openai", "ollama"]   # where agents go next if their first choice fails
  openai_model: "gpt-5.4-mini"                      # any model your OpenAI key can use
  openai_base_url: "https://api.openai.com/v1"      # works with any OpenAI-compatible service (OpenRouter, Groq...)
  ollama_url: "http://localhost:11434"
  ollama_model: "nemotron-3-nano:4b"   # fits a 16 GB Mac. The 30b version needs about 24 GB
  ollama_think: false        # true = better reasoning, much slower on a laptop
  ollama_context: 16384      # tokens of memory per conversation; higher uses more RAM
  local_parallel: 1          # on-device tasks run at once. A laptop chip shares its speed between them

tools:
  disabled: []               # Jarvis's own quick tools to switch off, e.g. [describe_screen, read_clipboard]
  allowed_roots: ["~"]       # folders the quick file tools may touch

agents:
  permission_mode: "trusted"   # ask = approve every action | trusted = free, but risky actions need your OK | full = no prompts
  workspace: "~/Jarvis Workspace"   # agents' default working folder; also holds backups/ and tasks/ reports
  model: "gemini-3.8-flash"    # the stronger model agents use when they run on Gemini
  thinking_level: "medium"     # blank = model default
  max_concurrent: 6            # agents working at the same time (extra tasks queue)
  max_steps: 40                # tool calls one agent may make per task
  max_delegation_depth: 2      # agents may spawn helper agents this many levels deep
  approval_timeout_seconds: 600
  announce_completion: true    # Jarvis tells you when an agent finishes
